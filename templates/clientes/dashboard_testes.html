<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão QA - Devila Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-primary: #f8fafc;
            --text-secondary: #94a3b8; --accent-blue: #38bdf8; --accent-green: #22c55e;
            --accent-red: #ef4444; --border-color: #334155;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-primary); margin: 0; padding: 20px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .header h1 { font-size: 22px; margin: 0; } .header span { color: var(--accent-blue); }
        .btn-back { color: var(--text-secondary); text-decoration: none; font-size: 14px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); display: flex; gap: 5px; align-items: center; }

        .action-area { margin-bottom: 30px; }
        .btn-action-main { width: 100%; background: linear-gradient(90deg, var(--accent-blue), #0ea5e9); color: #0f172a; padding: 15px; border-radius: 12px; text-align: center; font-weight: 800; text-decoration: none; display: block; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2); }

        .search-container { position: relative; margin-bottom: 30px; }
        .search-box { width: 100%; background-color: var(--bg-card); border: 2px solid var(--border-color); padding: 15px; border-radius: 8px; color: white; font-size: 16px; outline: none; transition: 0.2s; box-sizing: border-box; }
        .search-box:focus { border-color: var(--accent-blue); }
        .autocomplete-list { position: absolute; top: 105%; left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--accent-blue); border-radius: 8px; max-height: 300px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .autocomplete-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; flex-direction: column; }
        .autocomplete-item:hover { background-color: rgba(56, 189, 248, 0.15); }
        .item-text { font-weight: 600; } .item-sub { font-size: 12px; color: var(--text-secondary); }

        .selected-area { margin-top: 20px; }
        .project-card { background: var(--bg-card); border-left: 4px solid var(--accent-blue); border-radius: 8px; padding: 20px; margin-bottom: 15px; position: relative; animation: fadeIn 0.3s; border-right: 1px solid var(--border-color); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .card-title { font-size: 16px; font-weight: 700; color: white; margin-bottom: 5px; }
        .card-code { font-size: 12px; color: var(--accent-blue); background: rgba(56, 189, 248, 0.1); padding: 4px 8px; border-radius: 4px; display: inline-block; font-family: monospace; }
        .btn-remove { position: absolute; top: 15px; right: 15px; color: #ef4444; background: none; border: none; font-size: 20px; cursor: pointer; opacity: 0.7; }
        .btn-remove:hover { opacity: 1; }
        .btn-attachments { margin-top: 15px; width: 100%; padding: 12px; background: rgba(34, 197, 94, 0.1); border: 1px solid var(--accent-green); color: var(--accent-green); border-radius: 6px; cursor: pointer; font-weight: 700; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-attachments:hover { background: var(--accent-green); color: #0f172a; }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-main); width: 90%; max-width: 700px; height: 85vh; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); }
        .modal-title { font-size: 16px; font-weight: 700; }
        .modal-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .modal-body { flex: 1; padding: 20px; overflow-y: auto; }
        
        /* Navegação Pastas */
        .breadcrumbs { font-size: 13px; color: var(--accent-blue); padding: 10px; background: rgba(0,0,0,0.2); border-radius: 6px; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .btn-up { border: 1px solid var(--border-color); background: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        /* Lista de Arquivos */
        .file-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 10px; transition: 0.2s; }
        .file-item:hover { border-color: var(--accent-blue); }
        .file-info { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
        .file-icon { font-size: 20px; }
        .file-name { font-weight: 600; color: white; text-decoration: none; font-size: 14px; }
        .file-meta { font-size: 11px; color: var(--text-secondary); margin-left: 10px; }
        .btn-download-file { color: var(--accent-green); background: none; border: none; cursor: pointer; font-size: 18px; margin-right: 5px; }
        .btn-delete-file { color: var(--accent-red); background: none; border: none; cursor: pointer; font-size: 18px; }

        /* Upload Area */
        .upload-area { border-top: 1px solid var(--border-color); padding: 15px; background: var(--bg-card); display: flex; gap: 10px; align-items: center; }
        .file-input { display: none; }
        .btn-upload-trigger { flex: 1; background: var(--accent-blue); color: #0f172a; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; border: none; }
        .btn-create-folder { background: rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <a href="/cliente/procer" class="btn-back">⬅ Voltar</a>
            <h1>Gestão <span>QA</span></h1>
        </div>
        <img src="{{ url_for('static', filename='images/logo.png') }}?v=3" style="height: 25px; opacity: 0.8;">
    </div>

    <div class="action-area">
        <a href="/cliente/procer/testes/lista" class="btn-action-main">ACESSAR FILA DE TESTES</a>
    </div>

    <div class="kpi-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:30px;">
        <div style="background:var(--bg-card); padding:15px; border-radius:10px; border:1px solid var(--border-color); text-align:center;">
            <div style="color:var(--accent-blue); font-size:24px; font-weight:800;">12</div>
            <div style="font-size:11px; color:var(--text-secondary);">AGUARDANDO</div>
        </div>
        <div style="background:var(--bg-card); padding:15px; border-radius:10px; border:1px solid var(--border-color); text-align:center;">
            <div style="color:var(--accent-green); font-size:24px; font-weight:800;">94%</div>
            <div style="font-size:11px; color:var(--text-secondary);">APROVAÇÃO</div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar Projeto (Digite cód ou nome)..." autocomplete="off">
        <div id="suggestionsList" class="autocomplete-list"></div>
    </div>

    <div class="selected-area">
        <div style="color: var(--text-secondary); margin-bottom: 15px; font-size: 14px; text-transform: uppercase; font-weight: 700;">
            Projetos em Andamento
        </div>
        <div id="selectedContainer">
            <div style="text-align:center; color:#475569; padding:30px; border:1px dashed #334155; border-radius:8px;">Carregando...</div>
        </div>
    </div>

    <div id="attachmentsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Anexos: <span id="modalProjId" style="color:var(--accent-blue)"></span></span>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            
            <div class="modal-body">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <div id="breadcrumbs" class="breadcrumbs">📁 Raiz</div>
                    <button id="btnUp" class="btn-up" onclick="goUp()" style="display:none;">⬆ Voltar</button>
                </div>

                <div id="filesList">
                    <div style="text-align:center; color:#999;">Carregando...</div>
                </div>
            </div>

            <div class="upload-area">
                <input type="file" id="fileInput" class="file-input" multiple onchange="uploadFiles()">
                <button class="btn-create-folder" onclick="createFolder()" title="Nova Pasta">📁 +</button>
                <button class="btn-upload-trigger" onclick="document.getElementById('fileInput').click()">
                    Enviar Arquivo
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentProjectId = null;
        let currentPath = ""; // Caminho atual (ex: "Fotos/Interna")

        document.addEventListener('DOMContentLoaded', () => {
            loadSharedProjects();
            setInterval(loadSharedProjects, 5000);
        });

        // 1. CARREGAR PROJETOS (BANCO)
        async function loadSharedProjects() {
            const container = document.getElementById('selectedContainer');
            try {
                const response = await fetch('/api/active_projects');
                const projects = await response.json();
                container.innerHTML = '';
                if (projects.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:#475569; padding:30px; border:1px dashed #334155; border-radius:8px;">Nenhum projeto em teste no momento.</div>';
                    return;
                }
                projects.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    card.innerHTML = `
                        <button class="btn-remove" onclick="removeSharedProject('${item.id}')" title="Remover">×</button>
                        <div class="card-title">${item.descricao}</div>
                        <div class="card-code">ID: ${item.id}</div>
                        <div style="font-size:11px; color:#666; margin-top:5px;">Por: ${item.added_by}</div>
                        <button class="btn-attachments" onclick="openAttachments('${item.id}')">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            VER ANEXOS
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        async function selectItem(item) {
            document.getElementById('suggestionsList').style.display = 'none';
            document.getElementById('searchInput').value = '';
            try {
                await fetch('/api/active_projects', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(item)
                });
                loadSharedProjects();
            } catch(e) { alert("Erro ao adicionar."); }
        }

        async function removeSharedProject(id) {
            if(!confirm("Remover da lista?")) return;
            try {
                await fetch(`/api/active_projects?id=${id}`, { method: 'DELETE' });
                loadSharedProjects();
            } catch(e) {}
        }

        // 2. BUSCA
        let debounceTimer;
        const input = document.getElementById('searchInput');
        const list = document.getElementById('suggestionsList');

        input.addEventListener('input', function() {
            const termo = this.value;
            clearTimeout(debounceTimer);
            list.style.display = 'none';
            if (termo.length < 3) return;
            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/projetos-quadros?q=${encodeURIComponent(termo)}`);
                    const data = await res.json();
                    list.innerHTML = '';
                    if (data.length > 0) {
                        list.style.display = 'block';
                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'autocomplete-item';
                            div.innerHTML = `<span class="item-text">${item.descricao}</span><span class="item-sub">ID: ${item.id}</span>`;
                            div.onclick = () => selectItem(item);
                            list.appendChild(div);
                        });
                    }
                } catch(e) {}
            }, 300);
        });

        // 3. ANEXOS COM PASTAS
        function openAttachments(id) {
            currentProjectId = id;
            currentPath = ""; // Reinicia na raiz
            document.getElementById('modalProjId').innerText = id;
            document.getElementById('attachmentsModal').style.display = 'flex';
            fetchFiles();
        }

        function closeModal() { document.getElementById('attachmentsModal').style.display = 'none'; }

        async function fetchFiles() {
            const listDiv = document.getElementById('filesList');
            const breadDiv = document.getElementById('breadcrumbs');
            const btnUp = document.getElementById('btnUp');

            breadDiv.innerText = currentPath ? `📁 ${currentPath}` : "📁 Raiz";
            btnUp.style.display = currentPath ? "block" : "none";
            listDiv.innerHTML = '<div style="text-align:center; color:#999;">Carregando...</div>';

            try {
                // Passa o caminho atual para a API
                const res = await fetch(`/api/anexos/${currentProjectId}?path=${encodeURIComponent(currentPath)}`);
                const data = await res.json();
                
                listDiv.innerHTML = '';
                if (data.items.length === 0) {
                    listDiv.innerHTML = '<div style="text-align:center; color:#666; margin-top:50px;">Pasta vazia.</div>';
                    return;
                }

                data.items.forEach(f => {
                    let icon = '📄';
                    let action = '';
                    let nameHtml = '';

                    if (f.is_dir) {
                        icon = '📁';
                        // Clicar na pasta entra nela
                        nameHtml = `<span class="file-name" style="cursor:pointer; color:#ffd700;" onclick="enterFolder('${f.name}')">${f.name}</span>`;
                    } else {
                        if (f.name.match(/\.(jpg|jpeg|png|gif)$/i)) icon = '🖼️';
                        if (f.name.match(/\.(mp4|mov)$/i)) icon = '🎥';
                        nameHtml = `<a href="${f.url}" target="_blank" class="file-name">${f.name}</a>`;
                        
                        // Download só pra arquivos
                        action += `<a href="${f.url}" download class="btn-download-file">⬇</a>`;
                    }

                    // Botão Excluir (Dono ou Admin)
                    if (f.can_delete) {
                        action += `<button class="btn-delete-file" onclick="deleteItem('${f.name}')">🗑</button>`;
                    }

                    const html = `
                        <div class="file-item">
                            <div class="file-info">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span>${icon}</span>
                                    ${nameHtml}
                                </div>
                                <div class="file-meta">
                                    <span class="uploader-badge">👤 ${f.uploader}</span>
                                    <span>📅 ${f.date}</span>
                                </div>
                            </div>
                            <div style="display:flex; align-items:center;">${action}</div>
                        </div>
                    `;
                    listDiv.innerHTML += html;
                });
            } catch(e) { listDiv.innerHTML = 'Erro ao carregar.'; }
        }

        // Navegação
        function enterFolder(folderName) {
            currentPath = currentPath ? `${currentPath}/${folderName}` : folderName;
            fetchFiles();
        }

        function goUp() {
            if (!currentPath) return;
            const parts = currentPath.split('/');
            parts.pop(); // Remove última pasta
            currentPath = parts.join('/');
            fetchFiles();
        }

        async function createFolder() {
            const name = prompt("Nome da nova pasta:");
            if (!name) return;
            
            try {
                const res = await fetch(`/api/anexos/${currentProjectId}?path=${encodeURIComponent(currentPath)}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({folder_name: name})
                });
                const data = await res.json();
                if (data.success) fetchFiles();
                else alert(data.error);
            } catch(e) { alert("Erro ao criar pasta"); }
        }

        async function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            try {
                // Envia para o caminho atual
                const res = await fetch(`/api/anexos/${currentProjectId}?path=${encodeURIComponent(currentPath)}`, { 
                    method: 'POST', body: formData 
                });
                if (res.ok) fetchFiles();
            } catch(e) {}
            fileInput.value = '';
        }

        async function deleteItem(filename) {
            if(!confirm(`Excluir "${filename}"?`)) return;
            try {
                const res = await fetch(`/api/anexos/${currentProjectId}?path=${encodeURIComponent(currentPath)}`, {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: filename})
                });
                const data = await res.json();
                if (data.success) fetchFiles();
                else alert(data.error);
            } catch(e) {}
        }

        document.addEventListener('click', (e) => {
            if (!input.contains(e.target) && !list.contains(e.target)) list.style.display = 'none';
        });
    </script>

</body>
</html>
