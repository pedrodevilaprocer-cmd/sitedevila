<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Saúde Digital - Carabelli</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0a101f; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1a2744; width: 100%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .logo-icon { font-size: 40px; color: #22d3ee; margin-bottom: 10px; }
        h2 { margin: 0; color: #fff; }
        p { color: #a0aec0; font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #a0aec0; font-weight: 500; font-size: 14px; }
        input[type="text"], textarea, select { width: 100%; padding: 12px; background: #0a101f; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-family: 'Poppins'; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #22d3ee; outline: none; }
        .btn-submit { background: linear-gradient(135deg, #22d3ee 0%, #0ea5e9 100%); border: none; width: 100%; padding: 15px; border-radius: 10px; color: #0a101f; font-weight: 700; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(34, 211, 238, 0.4); }
        .success-box { text-align: center; padding: 40px 20px; }
        .success-icon { font-size: 60px; color: #34d399; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        {% if sucesso %}
            <div class="success-box">
                <i class="ph ph-check-circle success-icon"></i>
                <h2>Tudo Certo!</h2>
                <p>Sua ficha foi enviada com sucesso para a Dra. Carabelli.</p>
                <p>Obrigado!</p>
            </div>
        {% else %}
            <div class="header">
                <i class="ph ph-tooth logo-icon"></i>
                <h2>Ficha de Saúde</h2>
                <p>Paciente: <strong>{{ nome_paciente }}</strong></p>
            </div>

            <form method="POST">
                <div class="form-group">
                    <label>Possui alguma alergia? Se sim, qual?</label>
                    <input type="text" name="alergias" placeholder="Ex: Penicilina, Dipirona...">
                </div>

                <div class="form-group">
                    <label>Toma algum medicamento de uso contínuo?</label>
                    <input type="text" name="medicamentos" placeholder="Ex: Pressão, Diabetes...">
                </div>

                <div class="form-group">
                    <label>Tem ou já teve alguma doença grave?</label>
                    <input type="text" name="doencas" placeholder="Ex: Cardíaca, Diabetes...">
                </div>

                <div class="form-group">
                    <label>Já fez alguma cirurgia recente?</label>
                    <input type="text" name="cirurgias" placeholder="Qual e quando?">
                </div>

                <div class="form-group">
                    <label>Observações adicionais:</label>
                    <textarea name="obs" rows="3" placeholder="Algo mais que a Dra. precisa saber?"></textarea>
                </div>

                <input type="hidden" name="anamnese_completa" id="anamnese_completa">

                <button type="submit" class="btn-submit" onclick="prepararEnvio()">ENVIAR FICHA</button>
            </form>
        {% endif %}
    </div>

    <script>
        function prepararEnvio() {
            // Junta as respostas num texto formatado para salvar no campo 'anamnese'
            let texto = "";
            const campos = ['alergias', 'medicamentos', 'doencas', 'cirurgias', 'obs'];
            const labels = ['Alergias', 'Medicamentos', 'Doenças', 'Cirurgias', 'Obs'];
            
            campos.forEach((campo, index) => {
                let valor = document.getElementsByName(campo)[0].value;
                if(valor) texto += `[${labels[index]}]: ${valor}\n`;
            });
            
            if(!texto) texto = "Paciente declarou não ter alterações de saúde.";
            document.getElementById('anamnese_completa').value = texto;
        }
    </script>

</body>
</html>
